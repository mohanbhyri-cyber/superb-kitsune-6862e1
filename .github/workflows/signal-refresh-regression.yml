name: Signal refresh regression tests
on:
  push:
    branches:
      - fix/live-quote-timestamp-20261018
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modified JavaScript syntax
        run: |
          node --check live-quote.js
          node --check netlify/functions/live-quote.js
          node --check candle-refresh-schedule.js
          node --check candle-refresh-schedule.test.js
      - name: Run targeted tests
        run: node --test candle-refresh-schedule.test.js live-quote.test.js
