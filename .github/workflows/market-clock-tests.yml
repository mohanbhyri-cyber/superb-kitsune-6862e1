name: Market clock and Upstox request tests
on:
  push:
    branches:
      - fix/market-clock-sync-20261009
  pull_request:
    paths:
      - 'market.js'
      - 'market-clock.js'
      - 'tests/**'
      - '.github/workflows/market-clock-tests.yml'
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/market-clock.test.js tests/upstox-request.test.js
